---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app recyclarr
spec:
  components:
    - ../../../components/volsync
  path: ./kubernetes/apps/media/recyclarr/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: volsync
      namespace: volsync
    - name: external-secrets-stores
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 1Gi
