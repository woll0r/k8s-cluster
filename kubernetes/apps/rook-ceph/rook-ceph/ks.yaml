---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph
spec:
  path: ./kubernetes/apps/rook-ceph/rook-ceph/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: rook-ceph
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: external-secrets-stores
      namespace: kube-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ceph-csi-drivers
spec:
  path: ./kubernetes/apps/rook-ceph/rook-ceph/ceph-csi
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: rook-ceph
  dependsOn:
    - name: rook-ceph
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-cluster
spec:
  path: ./kubernetes/apps/rook-ceph/rook-ceph/cluster
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: &namespace rook-ceph
  dependsOn:
    - name: rook-ceph
    - name: ceph-csi-drivers
    - name: snapshot-controller
      namespace: volsync
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: rook-ceph-cluster
      namespace: *namespace
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: *namespace
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      failed: status.ceph.health == 'HEALTH_ERR'
      current: status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
