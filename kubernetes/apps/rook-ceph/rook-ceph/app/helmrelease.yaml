---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
  namespace: rook-ceph
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    crds:
      enabled: true
    monitoring:
      enabled: true
    csi:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 500m
        memory: 128Mi
      limits: {}
