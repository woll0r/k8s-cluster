---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cloudnative-pg
spec:
  retentionPolicy: 30d
  configuration:
    wal:
      compression: bzip2
      maxParallel: 8
    destinationPath: s3://cloudnative-pg/
    endpointURL: http://garage.storage.svc:9000
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg
        key: S3_ACCESS_KEY
      secretAccessKey:
        name: cloudnative-pg
        key: S3_SECRET_KEY
