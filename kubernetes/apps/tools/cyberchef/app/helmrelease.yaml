---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cyberchef
  namespace: tools
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: cyberchef
  install:
    createNamespace: true
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
  values:
    controllers:
      cyberchef:
        containers:
          app:
            image:
              repository: ghcr.io/gchq/cyberchef
              tag: 11.5.0@sha256:fa74354a9c5dd014c8dacee843eb9218fb13465d678d8b049e97bc26a69a1640
            env:
              TZ: Europe/Brussels
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
    service:
      main:
        controller: *app
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames:
          - cyberchef.${SECRET_DOMAIN}
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: cyberchef
          gethomepage.dev/name: CyberChef
          gethomepage.dev/description: Cyber Swiss Army Knife
          gethomepage.dev/group: Tools
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
